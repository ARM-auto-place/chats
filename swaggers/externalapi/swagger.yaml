components:
    schemas:
        models.Chat:
            type: object
            properties:
                botActive:
                    type: boolean
                createdAt:
                    type: string
                    format: date-time
                dialogStartedAt:
                    oneOf:
                        - type: string
                          format: date-time
                        - nullable: true
                id:
                    type: string
                    format: uuid
                ownerUserId:
                    type: string
                    format: uuid
        models.ChatListItem:
            type: object
            properties:
                Chat:
                    $ref: '#/components/schemas/models.Chat'
                lastMessageAt:
                    oneOf:
                        - type: string
                          format: date-time
                        - nullable: true
                lastMessageText:
                    oneOf:
                        - type: string
                        - nullable: true
                unread:
                    type: number
                    format: int
        models.ChatListResponse:
            type: object
            properties:
                chats:
                    type: array
                    items:
                        $ref: '#/components/schemas/models.ChatListItem'
                    nullable: true
                hasNext:
                    type: boolean
        models.Message:
            type: object
            properties:
                chatId:
                    type: string
                    format: uuid
                id:
                    type: string
                    format: uuid
                isSystem:
                    type: boolean
                senderId:
                    type: string
                    format: uuid
                sentAt:
                    type: string
                    format: date-time
                text:
                    type: string
        models.MessagesResponse:
            type: object
            properties:
                hasNext:
                    type: boolean
                messages:
                    type: array
                    items:
                        $ref: '#/components/schemas/models.Message'
                    nullable: true
        models.SuccessData:
            type: object
            properties:
                bot_active:
                    oneOf:
                        - type: boolean
                        - nullable: true
                chats:
                    type: array
                    items:
                        $ref: '#/components/schemas/models.ChatListItem'
                    nullable: true
                created_at:
                    oneOf:
                        - type: string
                          format: date-time
                        - nullable: true
                dialog_started_at:
                    oneOf:
                        - type: string
                          format: date-time
                        - nullable: true
                has_next:
                    oneOf:
                        - type: boolean
                        - nullable: true
                id:
                    type: string
                    format: uuid
                messages:
                    type: array
                    items:
                        $ref: '#/components/schemas/models.Message'
                    nullable: true
                owner_user_id:
                    type: string
                    format: uuid
        requestChatAPIGetMessages:
            type: object
        requestChatAPIGetOrCreateSupportChat:
            type: object
        requestChatAPIListSupportQueue:
            type: object
        requestChatAPIMarkRead:
            type: object
        requestChatAPISetChatStage:
            type: object
        responseChatAPIGetMessages:
            type: object
            required:
                - data
            properties:
                data:
                    $ref: '#/components/schemas/models.MessagesResponse'
            description: 'Пагинация назад: before — sent_at,id последнего сообщения; legacy RFC3339 также принимается'
        responseChatAPIGetOrCreateSupportChat:
            type: object
            required:
                - data
            properties:
                data:
                    $ref: '#/components/schemas/models.Chat'
            description: Возвращает единственный support-чат пользователя, создавая его при первом обращении
        responseChatAPIListSupportQueue:
            type: object
            required:
                - data
            properties:
                data:
                    $ref: '#/components/schemas/models.ChatListResponse'
            description: Список всех чатов; доступен только сотрудникам с ролью Admin
        responseChatAPIMarkRead:
            type: object
            required:
                - data
            properties:
                data:
                    type: boolean
            description: Обновляет read-receipt вызывающего пользователя для чата
        responseChatAPISetChatStage:
            type: object
            required:
                - data
            properties:
                data:
                    $ref: '#/components/schemas/models.Chat'
            description: 'stage: "operator" — сразу глушит бота (оператор подключается к диалогу), "bot" — возвращает диалог боту. Доступ: владелец чата или роль Admin'
