openapi: 3.0.0
info:
    title: chat
    version: 0.0.1
servers:
    - {}
paths:
    /api/v1/chat/messages:
        get:
            tags:
                - ChatAPI
            summary: История сообщений чата
            description: 'Пагинация назад: before — sent_at,id последнего сообщения; legacy RFC3339 также принимается'
            parameters:
                - in: query
                  name: chatID
                  schema:
                    type: string
                    format: uuid
                - in: query
                  name: before
                  schema:
                    type: string
                - in: query
                  name: limit
                  schema:
                    type: number
                    format: int
                - in: cookie
                  name: x-user-id
                  required: true
                  schema:
                    type: string
                    format: uuid
            responses:
                "200":
                    description: Successful operation
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    additionalErrors:
                                        type: object
                                        nullable: true
                                    data:
                                        $ref: '#/components/schemas/models.SuccessData'
                                    error:
                                        type: boolean
                                        example: false
                                        description: Флаг показывающий, что ответ пришел с ошибкой
                                    errorText:
                                        type: string
                "400":
                    description: Bad Request
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    additionalErrors:
                                        type: object
                                        example:
                                            field: chatID
                                        description: Текст ошибки, при ответе
                                        additionalProperties:
                                            type: string
                                    data: {}
                                    error:
                                        type: boolean
                                        example: true
                                        description: Флаг показывающий, что ответ пришел с ошибкой
                                    errorText:
                                        type: string
                                        example: chat.errors.badRequest
                                        description: Заголовок ошибки
                "401":
                    description: Unauthorized
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    additionalErrors:
                                        description: Текст ошибки, при ответе, со статус кодом 401, не указывается
                                    data: {}
                                    error:
                                        type: boolean
                                        example: true
                                        description: Флаг показывающий, что ответ пришел с ошибкой
                                    errorText:
                                        type: string
                                        example: chat.errors.unauthorized
                                        description: Заголовок ошибки
                "403":
                    description: Forbidden
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    additionalErrors:
                                        description: Текст ошибки, при ответе, со статус кодом 403, не указывается
                                    data: {}
                                    error:
