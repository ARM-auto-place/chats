                                        example: chat.errors.forbidden
                                        description: Заголовок ошибки
                "500":
                    description: Internal Server Error
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    additionalErrors:
                                        description: Текст ошибки, при ответе, со статус кодом 403, не указывается
                                    data: {}
                                    error:
